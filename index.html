<style>
  #etad-bot-root {

    font-family: 'Inter', Arial, sans-serif;
  }

  #etad-bot-root * { box-sizing: border-box; margin: 0; padding: 0; }

  .etad-fab {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--co) 0%, #f59e0b 100%);
    color: #fff;
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--cs);
    transition: transform .2s ease, background .25s ease;
    animation: etad-pulse 3s infinite;
    position: relative;
  }

  .etad-fab:hover { transform: scale(1.08); }
  .etad-fab.is-open { animation: none; background: linear-gradient(135deg,#475569,#334155); font-size: 22px; }

  @keyframes etad-pulse {
    0%,100% { box-shadow: var(--cs), 0 0 0 0 rgba(249,115,22,.45); }
    50%      { box-shadow: var(--cs), 0 0 0 10px rgba(249,115,22,0); }
  }

  .etad-dot {
    position: absolute;
    top: 4px; right: 4px;
    width: 13px; height: 13px;
    background: var(--cg);
    border-radius: 50%;
    border: 2px solid #fff;
    display: none;
    animation: etad-blink 2s infinite;
  }

  .etad-dot.show { display: block; }

  @keyframes etad-blink {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  .etad-panel {
    position: absolute;
    right: 0;
    bottom: 80px;
    width: 390px;
    max-width: calc(100vw - 24px);
    height: 660px;
    max-height: calc(100vh - 110px);
    background: var(--cb);
    border: 1px solid var(--cbr);
    border-radius: var(--cr);
    box-shadow: var(--cs);
    display: none;
    flex-direction: column;
    overflow: hidden;
    transform-origin: bottom right;
  }

  .etad-panel.open {
    display: flex;
    animation: etad-in .22s ease;
  }

  @keyframes etad-in {
    from { opacity:0; transform: scale(.95) translateY(8px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }

  .etad-hdr {
    padding: 16px 18px 14px;
    background: linear-gradient(135deg,#0f1e35,#111827);
    border-bottom: 1px solid var(--cbr);
    flex-shrink: 0;
  }

  .etad-hdr-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .etad-hdr-l {
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .etad-av {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg,var(--co),#f59e0b);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .etad-hdr-name { font-size: 15px; font-weight: 700; color: var(--ct); }

  .etad-hdr-live {
    font-size: 12px;
    color: var(--cg);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }

  .etad-live-dot {
    width: 7px; height: 7px;
    background: var(--cg);
    border-radius: 50%;
  }

  .etad-hdr-sub {
    font-size: 11.5px;
    color: var(--cm);
    margin-top: 8px;
    line-height: 1.5;
  }

  .etad-x {
    border: none;
    background: rgba(255,255,255,.07);
    color: var(--cm);
    font-size: 18px;
    cursor: pointer;
    border-radius: 8px;
    width: 32px; height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }

  .etad-x:hover { background: rgba(255,255,255,.14); color: #fff; }

  .etad-prog-wrap {
    height: 3px;
    background: rgba(255,255,255,.08);
    margin: 0;
    overflow: hidden;
    flex-shrink: 0;
    display: none;
  }

  .etad-prog-fill {
    height: 100%;
    background: linear-gradient(90deg,var(--co),#f59e0b);
    transition: width .4s ease;
    width: 0%;
  }

  .etad-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    background:
      radial-gradient(ellipse at top right, rgba(249,115,22,.07), transparent 45%),
      radial-gradient(ellipse at bottom left, rgba(56,189,248,.06), transparent 45%),
      var(--cb);
  }

  .etad-body::-webkit-scrollbar { width: 4px; }
  .etad-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

  .etad-msg-wrap { display: flex; flex-direction: column; }

  .etad-msg {
    max-width: 86%;
    padding: 11px 14px;
    border-radius: 18px;
    font-size: 13.5px;
    line-height: 1.55;
    white-space: pre-line;
    margin-bottom: 10px;
    animation: etad-pop .18s ease;
  }

  @keyframes etad-pop {
    from { opacity:0; transform: translateY(6px); }
    to   { opacity:1; transform: translateY(0); }

  .etad-msg.bot {
    background: var(--cp2);
    border: 1px solid var(--cbr);
    color: var(--ct);
    border-top-left-radius: 5px;
    align-self: flex-start;

  .etad-msg.usr {
    background: linear-gradient(135deg,var(--co),#f59e0b);
    color: #fff;
    border-top-right-radius: 5px;
    align-self: flex-end;
    font-weight: 500;
  }

  .etad-typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 12px 16px;
    background: var(--cp2);
    border: 1px solid var(--cbr);
    border-radius: 18px;
    border-top-left-radius: 5px;
    width: fit-content;
    margin-bottom: 10px;
    animation: etad-pop .18s ease;
  }

  .etad-typing span {
    width: 7px; height: 7px;
    background: var(--cm);
    border-radius: 50%;
    animation: etad-bounce .9s infinite;
  }

  .etad-typing span:nth-child(2) { animation-delay: .15s; }
  .etad-typing span:nth-child(3) { animation-delay: .30s; }

  @keyframes etad-bounce {
    0%,60%,100% { transform: translateY(0); opacity:.5; }
    30%          { transform: translateY(-5px); opacity:1; }
  }

  .etad-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 14px;
    animation: etad-pop .2s ease;
  }

  .etad-chip {
    border: 1px solid rgba(249,115,22,.35);
    background: rgba(249,115,22,.08);
    color: #fbd5b5;
    padding: 8px 13px;
    font-size: 12.5px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s ease;
    font-family: inherit;
  }

  .etad-chip:hover {
    background: rgba(249,115,22,.22);
    border-color: var(--co);
    color: #fff;
    transform: translateY(-1px);
  }

  .etad-foot {
    border-top: 1px solid var(--cbr);
    padding: 12px 14px 10px;
    background: rgba(0,0,0,.2);
    flex-shrink: 0;

  .etad-irow {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .etad-inp {
    flex: 1;

  .etad-inp::placeholder { color: var(--cm); }

  .etad-foot-meta {
    display: flex;
    justify-content: space-between;

      max-width: 100vw;
      height: calc(100vh - 90px);
      max-height: calc(100vh - 90px);
      border-radius: 20px 20px 0 0;

(function(){
  'use strict';

  /* --- CONFIG --- */
  var FS_URL = 'https://formsubmit.co/ajax/sales@eyetoad.com';

  var inp     = document.getElementById('etadInput');
  var sndBtn  = document.getElementById('etadSendBtn');
  var statEl  = document.getElementById('etadStatus');
  var progW   = document.getElementById('etadProgWrap');
  var progF   = document.getElementById('etadProgFill');

  /* --- STATE --- */
  var S = {
    open: false,
    ready: false,
    capture: false,
    field: null,
    lead: { name:'', company:'', phone:'', email:'', website:'', industry:'', service:'', budget:'', notes:'' }
  };

  /* --- PROGRESS --- */
  function setProgress() {
    if (!S.capture) { progW.style.display = 'none'; return; }
    progW.style.display = 'block';
    var fields = ['name','company','phone','email','website','industry','service','budget'];
    var done = fields.filter(function(f){ return S.lead[f]; }).length;
    progF.style.width = Math.round((done / fields.length) * 100) + '%';
  }

  /* --- RENDER --- */
  function scroll() { chatEl.scrollTop = chatEl.scrollHeight; }

  function msg(text, who) {
    who = who || 'bot';
    var w = document.createElement('div');
    w.className = 'etad-msg-wrap';
    var m = document.createElement('div');
    m.className = 'etad-msg ' + who;
    m.textContent = text;
    w.appendChild(m);
    chatEl.appendChild(w);
    scroll();
  }

  function showTyping() {
    var el = document.createElement('div');
    el.className = 'etad-typing';
    el.id = 'etadTyping';
    el.innerHTML = '<span></span><span></span><span></span>';
    chatEl.appendChild(el);
    scroll();
    return el;
  }

  function botMsg(text, delay) {
    delay = delay || 650;
    return new Promise(function(resolve) {
      var el = showTyping();
      setTimeout(function() {
        if (el.parentNode) el.parentNode.removeChild(el);
        msg(text, 'bot');
        scroll();
        resolve();
      }, delay);
    });
  }

  function chips(labels) {
    /* Remove any existing chip rows */
    var old = chatEl.querySelectorAll('.etad-chips');
    old.forEach(function(el){ el.parentNode.removeChild(el); });

    var wrap = document.createElement('div');
    wrap.className = 'etad-chips';
    labels.forEach(function(lbl) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'etad-chip';
      b.textContent = lbl;
      b.addEventListener('click', function(){
        /* Remove all chip rows on click */
        chatEl.querySelectorAll('.etad-chips').forEach(function(el){
          el.parentNode.removeChild(el);
        });
        handle(lbl);
      });
      wrap.appendChild(b);
    });
    chatEl.appendChild(wrap);
    scroll();

  /* --- OPEN / CLOSE --- */

    S.open = true;
    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
    fab.classList.add('is-open');
    fab.setAttribute('aria-expanded', 'true');
    /* Replace FAB content with X safely */
    fab.textContent = 'x';
    dot.className = 'etad-dot'; /* hide dot */
    if (!S.ready) { S.ready = true; initChat(); }
    setTimeout(function(){ inp.focus(); }, 150);
  }

  function closeChat() {
    S.open = false;
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
    fab.classList.remove('is-open');
    fab.setAttribute('aria-expanded', 'false');
    /* Restore FAB content */
    fab.textContent = '';
    var emoji = document.createTextNode('Chat');
    fab.appendChild(emoji);
    /* Re-append dot span since we wiped innerHTML */
    var newDot = document.createElement('span');
    newDot.className = 'etad-dot';
    newDot.id = 'etadDot';
    fab.appendChild(newDot);

  /* --- HELPERS --- */
  function norm(s) { return (s||'').toLowerCase(); }

  function matchAny(text, keys) {
    var t = norm(text);
    for (var i=0; i<keys.length; i++) {
      if (t.indexOf(norm(keys[i])) !== -1) return true;
    }
    return false;
  }

  /* --- LEAD CAPTURE --- */
  var PRIMARY_SERVICES = [
    'SEO / Local SEO','AIO / GEO','Website Design','Landing Pages / Funnels',
    'Conversion Optimization','Google Ads / PPC','Remarketing / Display',
    'Social Media','Facebook Marketplace','TV / Streaming Ads',
    'Email Marketing','Branding / Logo','Video Marketing',
    'Sales Training','E-commerce / Shopify','Full Marketing Strategy','Not Sure -- Need Advice'
  ];

  var BUDGETS = [
    'Under $1,000/mo','$1,000 - $2,000/mo','$2,000 - $4,000/mo',
    '$4,000 - $7,500/mo','$7,500+/mo','One-time project','Not sure yet'
  ];

  function startCapture(hint) {
    S.capture = true;
    if (hint && !S.lead.service) S.lead.service = hint;
    setProgress();
    botMsg(
      'Perfect -- let me collect a few details so we can put together a custom quote or strategy call.\n\nThis takes about 60 seconds. What\'s your name?',
      600
    ).then(function(){ S.field = 'name'; });
  }

  function askNext() {
    var l = S.lead;
    setProgress();

    if (!l.name)     { botMsg('What\'s your name?', 400).then(function(){ S.field='name'; }); return; }
    if (!l.company)  { botMsg('What company or business name are you with?', 400).then(function(){ S.field='company'; }); return; }
    if (!l.phone)    { botMsg('Best phone number to reach you?', 400).then(function(){ S.field='phone'; }); return; }
    if (!l.email)    { botMsg('And your email address?', 400).then(function(){ S.field='email'; }); return; }
    if (!l.website)  { botMsg('What\'s your website URL? (Type "none" if you don\'t have one yet)', 400).then(function(){ S.field='website'; }); return; }
    if (!l.industry) { botMsg('What industry is your business in?', 400).then(function(){ S.field='industry'; }); return; }
    if (!l.service)  {
      botMsg('Which service are you most interested in?', 400).then(function(){
        S.field = 'service';
        chips(PRIMARY_SERVICES);
      });
      return;
    }
    if (!l.budget)   {
      botMsg('What monthly budget range are you working with?', 400).then(function(){
        S.field = 'budget';
        chips(BUDGETS);
      });
      return;
    }
    if (!l.notes)    {
      botMsg('Last one -- anything else we should know about your goals or timeline? (Type "skip" to skip)', 400).then(function(){ S.field='notes'; });
      return;
    }

    S.field = null;
    submitLead();
  }

  function captureField(raw) {
    var v = raw.trim();

    if (S.field === 'phone' && v.replace(/\D/g,'').length < 10) {
      msg(v, 'usr');
      botMsg('Please enter a valid phone number (at least 10 digits).', 400);
      return;
    }
    if (S.field === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
      msg(v, 'usr');
      botMsg('Please enter a valid email address.', 400);
      return;
    }
    if (S.field === 'notes' && v.toLowerCase() === 'skip') {
      msg('(skipped)', 'usr');
      S.lead.notes = 'N/A';
      askNext();
      return;
    }

    msg(v, 'usr');
    S.lead[S.field] = v;
    askNext();
  }

  function submitLead() {
    S.capture = false;
    setProgress();
    var l = S.lead;
    statEl.textContent = 'Sending your request...';
    sndBtn.disabled = true;

    fetch(FS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: 'New Chatbot Lead -- eyetoad.com -- ' + l.name,
        _template: 'table',
        _captcha: 'false',
        Name: l.name,
        Company: l.company,
        Phone: l.phone,
        Email: l.email,
        Website: l.website,
        Industry: l.industry,
        Service: l.service,
        Budget: l.budget,
        Notes: l.notes,
        Source: 'eyetoad.com chatbot'
      })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      var ok = data.success === 'true' || data.success === true;
      if (ok) {
        botMsg(
          'Done! You\'re all set, ' + l.name + '!\n\n' +
          'Your information has been sent to the Eye To Ad Media team. ' +
          'You can expect to hear back within 1 business day -- often much sooner.\n\n' +
          'In the meantime, feel free to call:\nPh: 1-800-481-8638\nPh: (720) 249-6588\n\n' +
          'Is there anything else I can help you with?',
          700
        ).then(function(){
          chips(['Ask Another Question', 'Our Services', 'Call Now']);
        });
      } else {
        throw new Error('not ok');
      }
    })
    .catch(function(){
      botMsg(
        'I ran into a problem sending your request -- sorry about that!\n\nPlease reach out directly:\nPh: 1-800-481-8638\nEmail: sales@eyetoad.com\n\nYour info: ' + l.name + ' | ' + l.phone + ' | ' + l.email,
        400
      );
    })
    .finally(function(){
      statEl.textContent = '';
      sndBtn.disabled = false;
      S.lead = { name:'', company:'', phone:'', email:'', website:'', industry:'', service:'', budget:'', notes:'' };
      S.capture = false;
      S.field = null;
    });
  }

  /* --- QUERY ROUTING --- */
  function route(text) {
    var t = norm(text);

    if (matchAny(t, ['get a free audit','request a free audit','free audit','audit my site','seo audit','audit'])) {
      msg(text, 'usr'); startCapture('SEO / Conversion Audit'); return;
    }
    if (matchAny(t, ['get a quote','custom quote','pricing / quote','get a custom quote','request a quote','get a ppc quote','get a local seo','get a website quote','get a conversion audit','get a remarketing','get a tv','get a branding','get a marketplace','get an industry','email marketing quote','video marketing quote','youtube ads','google shopping','shopify help','e-commerce quote','sales training info','full business strategy'])) {
      msg(text, 'usr'); startCapture(); return;
    }
    if (matchAny(t, ['talk to a human','speak to someone','book a call','strategy call','callback','request a callback','yes, request a callback'])) {
      msg(text, 'usr'); humanRoute(); return;
    }
    if (matchAny(t, ['call now','call us'])) {
      msg(text, 'usr');
      botMsg('Call us anytime:\n\nPh: Toll-free: 1-800-481-8638\nPh: Denver: (720) 249-6588\n\nWe\'re available Monday-Friday, 8 AM-6 PM MT.', 400).then(function(){
        chips(['Get a Quote', 'Our Services']);
      });
      return;
    }
    if (matchAny(t, ['services','our services','what do you do','show services','what services'])) {
      msg(text, 'usr'); servicesOverview(); return;
    }
    if (matchAny(t, ['yes, collect my info','yes collect','yes start','yes, request'])) {
      msg(text, 'usr'); startCapture(); return;
    }
    if (matchAny(t, ['no thanks','just browsing','no just'])) {
      msg(text, 'usr');
      botMsg('No problem at all! Feel free to browse and ask me anything whenever you\'re ready.', 400).then(function(){
        chips(['SEO / AIO / GEO', 'Website / Funnel', 'Paid Ads', 'Pricing / Quote']);
      });
      return;
    }
    if (matchAny(t, ['ask another question','ask something else','more questions'])) {
      msg(text, 'usr');
      botMsg('Of course! Ask me anything about SEO, AIO, GEO, web design, ads, social, TV advertising, branding, or anything else marketing-related.', 400).then(function(){
        chips(['SEO / AIO / GEO', 'Paid Ads', 'Website / Funnel', 'Social / TV / Video', 'Get a Quote']);
      });
      return;
    }
    if (matchAny(t, ['gbp management','google business profile management'])) {
      msg(text, 'usr');
      botMsg('We offer Google Business Profile management as part of our Local SEO service -- profile optimization, post management, review strategy, Q&A, and ongoing monitoring. Would you like a quote?', 500).then(function(){
        chips(['Get a Local SEO Audit', 'Talk to a Human']);
      });
      return;
    }
    if (matchAny(t, ['local seo / maps'])) {
      msg(text, 'usr');
      lookupKB('local seo');
      return;
    }
    if (matchAny(t, ['aio & geo','geo strategy','aio strategy'])) {
      msg(text, 'usr');
      lookupKB('geo');
      return;
    }
    if (matchAny(t, ['paid ads','remarketing'])) {
      msg(text, 'usr');
      lookupKB('ppc');
      return;
    }
    if (matchAny(t, ['website / funnel'])) {
      msg(text, 'usr');
      lookupKB('website');
      return;
    }
    if (matchAny(t, ['social / tv / video'])) {
      msg(text, 'usr');
      lookupKB('social media');
      return;
    }
    if (matchAny(t, ['seo / aio / geo'])) {
      msg(text, 'usr');
      lookupKB('seo');
      return;
    }
    if (matchAny(t, ['facebook marketplace'])) {
      msg(text, 'usr');
      lookupKB('facebook marketplace');
      return;
    }
    if (matchAny(t, ['conversion optimization','conversion'])) {
      msg(text, 'usr');
      lookupKB('conversion');
      return;
    }

    /* KB scan */
    for (var i=0; i<KB.length; i++) {
      if (matchAny(t, KB[i].k)) {
        msg(text, 'usr');
        (function(item){
          botMsg(item.a, 700).then(function(){
            if (item.c) chips(item.c);
          });
        })(KB[i]);
        return;
      }
    }

    /* Fallback */
    msg(text, 'usr');
    botMsg(
      'I want to make sure I give you the most useful answer. I can help with:\n\n' +
      '- SEO, AIO, GEO strategy\n- Local SEO / Google Maps\n- Website design (WordPress, Shopify, custom)\n' +
      '- Conversion optimization\n- Google Ads, remarketing, programmatic\n- Social media and Facebook Marketplace\n' +
      '- TV / streaming advertising\n- Branding, video, email marketing\n- Sales training and protocols\n- Custom audits and quotes\n\n' +
      'Try typing what you need, or choose an option below.',
      600
    ).then(function(){
      chips(['SEO / AIO / GEO', 'Website / Funnel', 'Paid Ads', 'Social / TV / Video', 'Get a Free Audit', 'Talk to a Human']);
    });
  }

  function lookupKB(term) {
    for (var i=0; i<KB.length; i++) {
      if (matchAny(term, KB[i].k)) {
        (function(item){
          botMsg(item.a, 700).then(function(){
            if (item.c) chips(item.c);
          });
        })(KB[i]);
        return;
      }
    }
  }

  function servicesOverview() {
    botMsg(
      'Eye To Ad Media and Search Converts offer a comprehensive marketing stack.\n\nCore services:\n' +
      '- SEO (local, national, technical, content)\n- AIO -- AI Overview Optimization\n- GEO -- Generative Engine Optimization\n' +
      '- Local SEO / Google Maps\n- Website design (custom, WordPress, Shopify)\n- Landing pages and funnels\n' +
      '- Conversion Rate Optimization\n- Google Ads / PPC\n- Remarketing and programmatic display\n' +
      '- Social media (organic + paid)\n- Facebook Marketplace marketing\n- TV and streaming (OTT/CTV) advertising\n' +
      '- Email marketing\n- Branding and logo\n- Video marketing and YouTube ads\n' +
      '- Sales training and protocol development\n- E-commerce optimization\n- Custom audits and growth strategy\n\n' +
      'Everything is custom-scoped. No templates. No cookie-cutter packages.',
      900
    ).then(function(){
      chips(['Get a Free Audit', 'Pricing / Quote', 'SEO / AIO / GEO', 'Paid Ads', 'Talk to a Human']);
    });
  }

  function humanRoute() {
    botMsg(
      'Happy to connect you with the team!\n\n' +
      'Ph: Toll-free: 1-800-481-8638\nPh: Denver local: (720) 249-6588\nEmail: sales@eyetoad.com\nHours: Monday-Friday, 8 AM - 6 PM MT\n\n' +
      'Or I can collect your info for a callback or custom quote -- usually the fastest way to get moving.',
      600
    ).then(function(){
      chips(['Yes, collect my info', 'No thanks, just browsing']);
    });
  }

  /* --- MAIN HANDLER --- */
  function handle(raw) {
    var value = (raw||'').trim();
    if (!value) return;
    statEl.textContent = '';
    inp.value = '';
    inp.focus();

    if (S.capture && S.field) {
      captureField(value);
    } else {
      route(value);
    }
  }

  /* --- EVENTS --- */
  fab.addEventListener('click', function(){ S.open ? closeChat() : openChat(); });
  xBtn.addEventListener('click', closeChat);
  sndBtn.addEventListener('click', function(){ handle(inp.value); });
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); handle(inp.value); }
  });

  /* Show notification dot after 12s if chat never opened */
  setTimeout(function(){
    if (!S.ready && !S.open) { dot.classList.add('show'); }
  }, 12000);

})();
</script>
